team_id: fig_re
version: fig-es-1.0
default_template: templates/ES_Template_FIG_v1.0.docx
mapping:
  heading_style: Heading 1
  numbered_headings: true
  recursive_tables: true
  table_match: ordered normalized headers and row labels within section
  placeholders: effective italic bracketed text across runs; FY periods; explicit date, checkbox and configured
    table-cell anchors
  missing_anchor: named mapping gap; never omit a section
  layout_source: uploaded Word template only
sections:
- id: 1
  name: Request / Purpose
  description: Request / Purpose (the client's request for the deal)
  main_inputs: CAS, term sheet, RM business support email, information memorandum
  case_rule: Both
  draft_mode: Extract and summarise
  applicable_when: &id001
    op: always
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 2
  name: Summary of current client group exposure
  description: Summary of current client group exposure (existing limits approved and taken)
  main_inputs: CAS, prior ES; limits and utilisation extract if suggested
  case_rule: Renewal or existing client; nil if new to bank
  draft_mode: Computed table
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 3
  name: Key updates
  description: Key updates (latest developments that may affect the assessment; more important for renewals)
  main_inputs: Prior ES, credit comments or prior approval conditions, covenant monitoring report, annual
    reports, credit rating report, public news
  case_rule: Key for renewal; optional if new
  draft_mode: Synthesis
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: eq
    field: case_type
    value: renewal
- id: 4
  name: Business background
  description: Business background
  main_inputs: Annual reports, information memorandum or fund report, prior ES, industry code mapping
  case_rule: Both
  draft_mode: Extract and summarise
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 5
  name: Shareholding structure
  description: Shareholding structure
  main_inputs: Shareholding structure, annual reports
  case_rule: Both
  draft_mode: Extract, chart if available
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 6
  name: Key management and stakeholder
  description: Key management and stakeholder
  main_inputs: Annual reports, information memorandum or fund report
  case_rule: Both
  draft_mode: Extract and summarise
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 7
  name: Facility structure
  description: Facility structure
  main_inputs: Term sheet, CAS, pricing report, prior ES
  case_rule: Both
  draft_mode: Extract into table
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 8
  name: Security support
  description: Security support
  main_inputs: Term sheet, valuation report, insurance report
  case_rule: Both
  draft_mode: Extract; "unsecured" needs CA confirmation
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: true
  mandatory_when:
    op: always
- id: 9
  name: Source of repayment
  description: Source of repayment
  main_inputs: Sections 7 and 10, financial projections, rent roll, lease profile
  case_rule: Both
  draft_mode: Synthesis
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 10
  name: Financial highlights and analytics
  description: Financial highlights and analytics
  main_inputs: Financial spread, financial statements, annual reports, financial projections, compliance
    certificate
  case_rule: Both
  draft_mode: Computed figures with AI commentary
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 11
  name: Key credit risks and mitigates
  description: Key credit risks and mitigates
  main_inputs: Sections 3 to 10, covenant monitoring report, credit bureau report
  case_rule: Both
  draft_mode: Synthesis, CA to edit
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 12
  name: Credit rating
  description: Credit rating
  main_inputs: Credit rating report
  case_rule: Both
  draft_mode: Input only, never inferred
  applicable_when: *id001
  requires_ca_position: false
  requires_supplied_internal_rating: true
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 13
  name: Conduct of Account
  description: Conduct of Account (past repayment record of existing customers)
  main_inputs: Account conduct report, covenant monitoring report, compliance certificate, credit bureau
    report
  case_rule: Existing clients only
  draft_mode: Computed table plus summary
  applicable_when:
    op: eq
    field: existing_client
    value: true
  requires_ca_position: false
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
- id: 14
  name: 'Recommendation: conclusion'
  description: 'Recommendation: conclusion'
  main_inputs: All mandatory sections, credit comments or prior approval conditions, pricing report, RM
    business support email, CA position
  case_rule: Both
  draft_mode: CA led; AI drafts wording only
  applicable_when: *id001
  requires_ca_position: true
  requires_supplied_internal_rating: false
  unsecured_requires_ca_confirmation: false
  mandatory_when:
    op: always
