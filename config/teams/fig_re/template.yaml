narrative_anchors:
- section_id: 1
  text: '[Summarise the request in line with the CAS: borrower, facilities, amounts, tenor and purpose.]'
- section_id: 1
  text: '[Provide the justification for the request: relationship rationale, use of proceeds and why the
    structure is appropriate.]'
- section_id: 1
  text: '[Complete if the borrower is on Watchlist or Special Mention, or if the classification is changing.
    Attach the relevant extract of the last approved CAS.]'
- section_id: 2
  text: '[Limits approved and taken for the obligor group. State "Nil, new to bank" for existing limits
    where there is no relationship.]'
- section_id: 2
  text: '[Note any excesses, temporary limits, limits pending cancellation, or exposure of other lenders
    that is material.]'
- section_id: 3
  text: '[Latest developments since the last review that affect the assessment. For a new borrower, state
    that there is no prior review and refer to section 4.]'
- section_id: 3
  text: '[Y where there is an update in the area. The last column is Yes for an existing borrower with
    no update in all five areas, and for a new borrower.]'
- section_id: 4
  text: '[Business model, portfolio, key markets, competitive position and strategy.]'
- section_id: 4
  text: '[Market conditions for the borrower''s sector and how the borrower compares with peers on scale,
    leverage and performance.]'
- section_id: 4
  text: '[Material developments in the last twelve months: acquisitions, divestments, capital management,
    leasing and rating actions.]'
- section_id: 4
  text: '[For REITs, property funds and property backed borrowers.]'
- section_id: 5
  text: '[State the ultimate parent or sponsor, its support for the borrower, and any change in shareholding.]'
- section_id: 6
  text: '[Recent changes in the board, management or key stakeholders, and any governance matters.]'
- section_id: 7
  text: '[Proposed terms for each facility.]'
- section_id: 8
  text: '[Describe the security package and its ranking. If any facility is unsecured, state the basis,
    for example negative pledge and pari passu undertaking.]'
- section_id: 9
  text: '[For example net property income from the financing object and the borrower''s operating cash
    flow.]'
- section_id: 9
  text: '[For example refinancing, asset disposal, sponsor support or enforcement of security.]'
- section_id: 10
  text: '[Group figures from the financial statements.]'
- section_id: 10
  text: '[Explain the significant year-on-year movements in the tables above.]'
- section_id: 10
  text: '[If applicable. Net property income by segment or asset class.]'
- section_id: 10
  text: '[If applicable. Net property income by country.]'
- section_id: 10
  text: '[Profitability, balance sheet strength, leverage, liquidity and debt maturity, with the reasons
    for the main movements.]'
- section_id: 10
  text: '[Scope of the projection, the base case and the stress cases, and what they show about repayment
    capacity.]'
- section_id: 10
  text: '[Overall view of financial standing and outlook.]'
- section_id: 12
  text: '[What the external rating reflects. External ratings do not replace the internal rating.]'
- section_id: 13
  text: '[For a new borrower, state that there is no account history with the Bank and note any adverse
    public information.]'
- section_id: 14
  text: '[Summarise the basis of the recommendation, weighing the key risks against the mitigants. The
    wording follows the credit analyst''s stated position.]'
