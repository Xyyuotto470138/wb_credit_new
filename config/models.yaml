# B26 model routes. Null fields mean TODO: confirm; never infer a provider ID.
# Live routes (the project owner's decisions, 11 Nov 2026): Claude direct to Anthropic,
# GPT direct to OpenAI, every other model through OpenRouter. Only routes that follow this rule may be enabled, and
# only after their TODO fields are resolved. An enabled live route is callable only in a process started for a live
# run (WB_CREDIT_LIVE=1) with its key present. Tests and the mock demo never set that.
