  display_name: Mock A — reviewed order
  family: offline
  route: mock
  provider_type: openai_compatible
  base_url: null
  model_id: mock-v1
  api_key_env: null
  capabilities:
    json_mode: true
    context_size: null
  enabled: true
  bank_available: false
  weights: mock
